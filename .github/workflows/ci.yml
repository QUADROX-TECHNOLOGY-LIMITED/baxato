name: BAXATO Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Type-Check, Build & Run Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        run: npm install -g pnpm@11.24.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript Packages
        run: pnpm build

      - name: Execute Vitest Test Suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baxato_test
          JWT_SECRET: ci_secret_jwt_key_at_least_16_chars_test
          CLERK_PUBLISHABLE_KEY: pk_test_ci_mock_clerk_publishable_key
          CLERK_SECRET_KEY: sk_test_ci_mock_clerk_secret_key
        run: pnpm test
