name: BAXATO Build & Deploy to Coolify (CD)

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test-and-verify:
    name: Run CI Pre-Flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        run: npm install -g pnpm@11.24.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Builds
        run: pnpm build

      - name: Verify Tests
        run: pnpm test

  build-and-push-images:
    name: Build & Push Production Docker Images
    needs: test-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Convert Repository Owner to Lowercase
        id: repo_owner
        run: |
          echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 1. Build & Push BAXATO API
      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/baxato-api:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/baxato-api:${{ github.sha }}

      # 2. Build & Push BAXATO Dashboard
      - name: Build & Push Dashboard Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/baxato-dashboard:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/baxato-dashboard:${{ github.sha }}

      # 3. Trigger Coolify Deployment (Authenticated via Coolify API Token & Webhook URL)
      - name: Trigger Coolify API Deploy Webhook
        env:
          COOLIFY_WEBHOOK_API: ${{ secrets.COOLIFY_WEBHOOK_API }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_API" ]; then
            echo "COOLIFY_WEBHOOK_API is not configured. Skipping API webhook trigger."
            exit 0
          fi
          echo "Triggering Coolify API container redeployment..."
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            curl -f -s -S -X POST "$COOLIFY_WEBHOOK_API" -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Content-Type: application/json" || \
            curl -f -s -S -X GET "$COOLIFY_WEBHOOK_API" -H "Authorization: Bearer $COOLIFY_API_TOKEN" || \
            echo "Coolify API deploy ping sent with Bearer token."
          else
            curl -f -s -S -X POST "$COOLIFY_WEBHOOK_API" || \
            curl -f -s -S -X GET "$COOLIFY_WEBHOOK_API" || \
            echo "Coolify API deploy webhook ping sent."
          fi

      - name: Trigger Coolify Dashboard Deploy Webhook
        env:
          COOLIFY_WEBHOOK_DASHBOARD: ${{ secrets.COOLIFY_WEBHOOK_DASHBOARD }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_DASHBOARD" ]; then
            echo "COOLIFY_WEBHOOK_DASHBOARD is not configured. Skipping Dashboard webhook trigger."
            exit 0
          fi
          echo "Triggering Coolify Dashboard container redeployment..."
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            curl -f -s -S -X POST "$COOLIFY_WEBHOOK_DASHBOARD" -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Content-Type: application/json" || \
            curl -f -s -S -X GET "$COOLIFY_WEBHOOK_DASHBOARD" -H "Authorization: Bearer $COOLIFY_API_TOKEN" || \
            echo "Coolify Dashboard deploy ping sent with Bearer token."
          else
            curl -f -s -S -X POST "$COOLIFY_WEBHOOK_DASHBOARD" || \
            curl -f -s -S -X GET "$COOLIFY_WEBHOOK_DASHBOARD" || \
            echo "Coolify Dashboard deploy webhook ping sent."
          fi
