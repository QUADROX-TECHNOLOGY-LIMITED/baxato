<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="starShine" x1="60" y1="40" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF3D4"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="shadow" x="0" y="4" width="200" height="196" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C2410C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Brand Tile -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#stGrad)" filter="url(#shadow)"/>

  <!-- StarTimes Dynamic Four-Pointed Star Icon -->
  <g transform="translate(100, 80)">
    <!-- Central primary star with sharp aerodynamic facets -->
    <path d="M0 -42 C1 -12 12 -1 42 0 C12 1 1 12 0 42 C-1 12 -12 1 -42 0 C-12 -1 -1 -12 0 -42 Z" fill="url(#starShine)"/>
    
    <!-- Secondary inner facet flare -->
    <path d="M0 -30 C0.8 -8 8 -0.8 30 0 C8 0.8 0.8 8 0 30 C-0.8 8 -8 0.8 -30 0 C-8 -0.8 -0.8 -8 0 -30 Z" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Diagonal micro flares -->
    <path d="M-18 -18 L-8 -8 M18 -18 L8 -8 M-18 18 L-8 8 M18 18 L8 8" stroke="#FFE8B3" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center core jewel -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- "StarTimes" Brand Typography -->
  <text x="100" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="-0.5">
    StarTimes
  </text>
</svg>